# Release builds: `git tag vX.Y.Z && git push --tags` runs this through
# .github/workflows/release.yml. Check locally with
# `goreleaser release --snapshot --clean`.
version: 2

before:
  hooks:
    - go mod tidy
    - sh -c 'rm -rf completions && mkdir completions && for sh in bash zsh fish; do go run . completion "$sh" > "completions/tendactl.$sh"; done'

builds:
  - env:
      # Static binaries: no libc dependency, and linux/arm cross-builds
      # without an ARM C toolchain.
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/bluescorpian/tendactl/cmd.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64, arm]
    goarm: ["6", "7"]
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - completions/*

checksum:
  name_template: checksums.txt

nfpms:
  - package_name: tendactl
    homepage: https://github.com/bluescorpian/tendactl
    description: Command-line tool for Tenda routers, over the admin UI's web API.
    maintainer: Harry Kruger <dsharryh27@gmail.com>
    license: MIT
    formats: [deb, rpm, apk]
    contents:
      - src: completions/tendactl.bash
        dst: /usr/share/bash-completion/completions/tendactl
        file_info:
          mode: 0644
      - src: completions/tendactl.zsh
        dst: /usr/share/zsh/site-functions/_tendactl
        file_info:
          mode: 0644
      - src: completions/tendactl.fish
        dst: /usr/share/fish/vendor_completions.d/tendactl.fish
        file_info:
          mode: 0644

changelog:
  use: github
